name: Build

# Every push and pull request builds; pushing a tag also releases it.
on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runtime: steamrt3
    container:
      image: ghcr.io/femboykz/build-containers:${{ matrix.runtime }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          mkdir build && cd build
          python3 ../configure.py --enable-optimize
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GameFixes_mm-${{ matrix.name }}
          path: build/package/cs2

  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install AMBuild
        run: pip install git+https://github.com/alliedmodders/ambuild.git@5b0aa725beef33c9cf6a1b00659a010c3d9120d3

      - name: Configure
        run: |
          mkdir build; cd build
          python ../configure.py --enable-optimize

      - name: Build
        working-directory: build
        run: ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GameFixes_mm-windows
          path: build/package/cs2

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create archives
        run: |
          mkdir release
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/release/$name-$GITHUB_REF_NAME.zip" .)
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.zip
          generate_release_notes: true
